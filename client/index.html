<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SwatVenue - Find Perfect Event Venues in Swat Valley</title>
  <style>
    /* Immediate Static Loader Styling */
    #initial-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background-color: #0f172a; /* matches your primary-900 */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.5s ease-out, visibility 0.5s;
    }

    .loader-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 0.8s ease-out forwards;
    }

    .loader-circle {
      width: 80px;
      height: 80px;
      border: 3px solid rgba(212, 175, 55, 0.1);
      border-top: 3px solid #d4af37;
      border-radius: 50%;
      animation: spin 1.5s linear infinite;
    }

    .loader-text {
      margin-top: 24px;
      color: #ffffff;
      font-family: sans-serif;
      font-weight: 800;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font-size: 1.2rem;
    }

    .loader-text span { color: #d4af37; }

    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    
    .loader-hidden { opacity: 0; visibility: hidden; }
  </style>
</head>

<body>
  <div id="initial-loader">
    <div class="loader-content">
      <div class="loader-circle"></div>
      <h1 class="loader-text">Swat<span>Venue</span></h1>
    </div>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
